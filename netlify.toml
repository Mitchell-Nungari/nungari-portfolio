# Netlify
#
# The site is plain static files at the repository root; the only server-side
# piece is the events function.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Uploaded poster images live in the "posters" Blobs store and are served
# through the posters function, so the URL stays short: /posters/abc.jpg
[[redirects]]
  from = "/posters/*"
  to = "/.netlify/functions/posters/:splat"
  status = 200

# The admin page is not part of the site and must never be indexed
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# `netlify dev` serves the published folder on 8888 and mounts the functions
# under /.netlify/functions/* on the same origin.
[dev]
  publish = "."
  port = 8888
  autoLaunch = false

# ---------- Caching ----------
# Versioned assets never change in place; the ".v1" suffix is bumped on change.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.v1.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/site/*.v1.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.v1.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.v1.webm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML, JSON and the events endpoint must revalidate.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache"
